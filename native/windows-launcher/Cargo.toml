[package]
name = "opencodex-launcher"
version = "2.1.0"
edition = "2021"
description = "Windows launcher that starts the OpenCodex gateway and opens its dashboard"
license = "MIT"
publish = false

# Double-clicked by the user and also used as the logon autostart entry, so it
# must not flash a console window; see the windows_subsystem attribute in main.rs.
[[bin]]
name = "OpenCodex"
path = "src/main.rs"

[dependencies]
# Intentionally none at runtime: the launcher itself has no dependencies.

[target.'cfg(windows)'.build-dependencies]
# Build-time only, and used solely to attach the icon and version metadata.
# build.rs downgrades a failure here to a warning, so a machine without a
# resource compiler still produces a working (if unbranded) executable.
winresource = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
